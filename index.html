        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            overflow: hidden;

        }
        canvas {
            display: block;
            touch-action: none;

        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .card-hover {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card-hover:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 10px 25px -5px rgba(34, 197, 94, 0.4);
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: #22c55e;
            border-radius: 3px;
        }
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.8; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }
        .animate-pulse-glow {
            animation: pulse-glow 2s infinite ease-in-out;
        }

    <script>
    // Web Audio API Sound Synthesizer for Zero External Asset Dependencies
    class SoundFX {
        constructor() {
            this.ctx = null;
            this.enabled = true;
        }

        init() {
            if (!this.ctx) {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (AudioCtx) this.ctx = new AudioCtx();
            }
            if (this.ctx && this.ctx.state === 'suspended') {
                this.ctx.resume();
            }
        }

        playCut() {
            if (!this.enabled || !this.ctx) return;
            try {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300 + Math.random() * 150, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(80, this.ctx.currentTime + 0.06);
                gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.06);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.06);
            } catch (e) {}
        }

        playGem() {
            if (!this.enabled || !this.ctx) return;
            try {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600 + Math.random() * 200, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, this.ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.06, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.08);
            } catch (e) {}
        }

        playExplode() {
            if (!this.enabled || !this.ctx) return;
            try {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(120, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.25);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.25);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.25);
            } catch (e) {}
        }

        playLevelUp() {
            if (!this.enabled || !this.ctx) return;
            try {
                const notes = [440, 554.37, 659.25, 880];
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.12, this.ctx.currentTime + idx * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.08 + 0.2);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(this.ctx.currentTime + idx * 0.08);
                    osc.stop(this.ctx.currentTime + idx * 0.08 + 0.2);
                });
            } catch (e) {}
        }
    }

        currY: 0,
        dirX: 0,
        dirY: 0
    };

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Grass World Grid Initialization
    const WORLD_SIZE = 3000; // 3000x3000px map
    const GRASS_CELL_SIZE = 40;

    function initGrassWorld() {
        grassTiles = [];
        const cols = Math.floor(WORLD_SIZE / GRASS_CELL_SIZE);
        const rows = Math.floor(WORLD_SIZE / GRASS_CELL_SIZE);
        
        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                // Determine grass density / tallness
                const isTall = Math.random() < 0.85;
                grassTiles.push({
                    x: c * GRASS_CELL_SIZE + GRASS_CELL_SIZE / 2,
                    y: r * GRASS_CELL_SIZE + GRASS_CELL_SIZE / 2,
                    state: isTall ? 1 : 0, // 1 = Tall cuttable grass, 0 = Cut short
                    colorOffset: (Math.sin(c * 0.3) + Math.cos(r * 0.3)) * 10
                });
            }
        }
    }

    class Player {
        constructor(mowerConfig) {
            this.x = WORLD_SIZE / 2;
            this.y = WORLD_SIZE / 2;
            this.radius = 22;
            this.config = mowerConfig;
            
            // Base Stats calculation with Garage Bonuses
            const hpBonus = gameSave.upgrades.hp * 15;
            const speedBonus = 1 + (gameSave.upgrades.speed * 0.05);
            const pickupBonus = 1 + (gameSave.upgrades.pickup * 0.2);

            this.maxHp = mowerConfig.baseHp + hpBonus;
            this.hp = this.maxHp;
            this.speed = mowerConfig.baseSpeed * speedBonus;
            this.pickupRadius = 90 * pickupBonus;
            
            this.angle = 0;
            this.level = 1;
            this.exp = 0;
            this.nextLevelExp = 10;

            // Player Stat Modifiers from Level-up Passives
            this.statAreaMult = 1.0;
            this.statCdMult = 1.0;
            this.statSpeedMult = 1.0;

            // Active Weapons equipped
            this.weapons = {};
            this.addWeapon(mowerConfig.weapon);

            // Wheel Animation
            this.wheelAngle = 0;
            this.invincibleTimer = 0;
        }

        addWeapon(weaponId) {
            if (!this.weapons[weaponId]) {
                this.weapons[weaponId] = { level: 1, timer: 0 };
            } else {
                this.weapons[weaponId].level++;
            }
        }

        update(dt) {
            if (this.invincibleTimer > 0) this.invincibleTimer -= dt;

            // Player Movement Calculation
            let dx = 0;
            let dy = 0;

            // Keyboard Controls
            if (keys['KeyW'] || keys['ArrowUp']) dy -= 1;
            if (keys['KeyS'] || keys['ArrowDown']) dy += 1;
            if (keys['KeyA'] || keys['ArrowLeft']) dx -= 1;
            if (keys['KeyD'] || keys['ArrowRight']) dx += 1;

            // Touch Joystick Input Override
            if (touchJoystick.active) {
                dx = touchJoystick.dirX;
                dy = touchJoystick.dirY;
            }

            // Normalize vector
            const mag = Math.hypot(dx, dy);
            if (mag > 0.01) {
                const moveDx = (dx / (mag > 1 ? mag : 1)) * this.speed * this.statSpeedMult;
                const moveDy = (dy / (mag > 1 ? mag : 1)) * this.speed * this.statSpeedMult;

                this.x = Math.max(50, Math.min(WORLD_SIZE - 50, this.x + moveDx));
                this.y = Math.max(50, Math.min(WORLD_SIZE - 50, this.y + moveDy));

                this.angle = Math.atan2(dy, dx);
                this.wheelAngle += 0.2;

                // Create dirt/cut grass particle trail when moving
                if (Math.random() < 0.3) {
                    particles.push(new Particle(
                        this.x - Math.cos(this.angle) * 15,
                        this.y - Math.sin(this.angle) * 15,
                        (Math.random() - 0.5) * 1.5,
                        (Math.random() - 0.5) * 1.5,
                        '#4ade80',
                        Math.random() * 4 + 2,
                        0.3
                    ));
                }
            }

            // Cut grass directly underneath player body
            this.cutGrassInRadius(this.x, this.y, this.radius + 15);

            // Update & Attack Weapons
            this.updateWeapons(dt);

            // Collect EXP gems
            this.collectGems();
        }

        cutGrassInRadius(cx, cy, rad) {
            const col = Math.floor(cx / GRASS_CELL_SIZE);
            const row = Math.floor(cy / GRASS_CELL_SIZE);
            const checkDist = Math.ceil(rad / GRASS_CELL_SIZE) + 1;

            const cols = Math.floor(WORLD_SIZE / GRASS_CELL_SIZE);
            const rows = Math.floor(WORLD_SIZE / GRASS_CELL_SIZE);

            let cutAny = false;

            for (let r = Math.max(0, row - checkDist); r <= Math.min(rows - 1, row + checkDist); r++) {
                for (let c = Math.max(0, col - checkDist); c <= Math.min(cols - 1, col + checkDist); c++) {
                    const tile = grassTiles[r * cols + c];
                    if (tile && tile.state === 1) {
                        const dist = Math.hypot(tile.x - cx, tile.y - cy);
                        if (dist <= rad) {
                            tile.state = 0; // Cut grass
                            cutAny = true;
                            killsCount++;

                            // Spawn flying cut grass blade particles
                            for (let i = 0; i < 2; i++) {
                                particles.push(new Particle(
                                    tile.x + (Math.random() - 0.5) * 10,
                                    tile.y + (Math.random() - 0.5) * 10,
                                    (Math.random() - 0.5) * 3,
                                    (Math.random() - 0.5) * 3 - 1,
                                    '#86efac',
                                    Math.random() * 3 + 2,
                                    0.4
                                ));
                            }

                            // Chance to drop exp gem from raw grass
                            if (Math.random() < 0.08) {
                                gems.push(new Gem(tile.x, tile.y, 'green', 1));
                            }
                        }
                    }
                }
            }

            if (cutAny) audio.playCut();
        }

        updateWeapons(dt) {
            // 1. Orbit Rotating Blade
            if (this.weapons['orbit_blade']) {
                const lvl = this.weapons['orbit_blade'].level;
                const count = 1 + lvl;
                const orbitSpeed = 2.5;
                const orbitRadius = (60 + lvl * 8) * this.statAreaMult;

                for (let i = 0; i < count; i++) {
                    const bAngle = (gameTime * orbitSpeed) + (i * (Math.PI * 2 / count));
                    const bx = this.x + Math.cos(bAngle) * orbitRadius;
                    const by = this.y + Math.sin(bAngle) * orbitRadius;

                    this.cutGrassInRadius(bx, by, 25);

                    // Hit enemies
                    enemies.forEach(e => {
                        if (Math.hypot(e.x - bx, e.y - by) < e.radius + 20) {
                            e.takeDamage(15 + lvl * 8, bx, by);
                        }
                    });

                    // Draw blade particle effect
                    if (Math.random() < 0.2) {
                        particles.push(new Particle(bx, by, 0, 0, '#34d399', 3, 0.2));
                    }
                }
            }

            // 2. Flying Scythe Boomerang
            if (this.weapons['flying_scythe']) {
                const w = this.weapons['flying_scythe'];
                w.timer += dt;
                const cooldown = Math.max(0.4, (1.8 - w.level * 0.2) * this.statCdMult);
                if (w.timer >= cooldown) {
                    w.timer = 0;
                    const count = Math.min(5, w.level);
                    for (let i = 0; i < count; i++) {
                        const angle = Math.random() * Math.PI * 2;
                        projectiles.push(new ScytheProjectile(this.x, this.y, angle, w.level, this.statAreaMult));
                    }
                }
            }

            // 3. Laser Beam Cutter
            if (this.weapons['laser_cutter']) {
                const w = this.weapons['laser_cutter'];
                w.timer += dt;
                const cooldown = Math.max(0.3, (1.2 - w.level * 0.15) * this.statCdMult);
                if (w.timer >= cooldown) {
                    const target = getClosestEnemy(this.x, this.y, 350);
                    if (target) {
                        w.timer = 0;
                        projectiles.push(new LaserBeam(this.x, this.y, target, w.level));
                    }
                }
            }

            // 4. Pulse Shockwave
            if (this.weapons['pulse_wave']) {
                const w = this.weapons['pulse_wave'];
                w.timer += dt;
                const cooldown = Math.max(1.0, (3.0 - w.level * 0.3) * this.statCdMult);
                if (w.timer >= cooldown) {
                    w.timer = 0;
                    const pulseRadius = (120 + w.level * 25) * this.statAreaMult;
                    projectiles.push(new PulseWave(this.x, this.y, pulseRadius, w.level));
                    audio.playExplode();
                }
            }

            // 5. Drone Cutter
            if (this.weapons['drone_cutter']) {
                const lvl = this.weapons['drone_cutter'].level;
                const droneAngle = gameTime * 1.5;
                const dx = this.x + Math.cos(droneAngle) * 90;
                const dy = this.y + Math.sin(droneAngle) * 90;

                this.cutGrassInRadius(dx, dy, 30);
                enemies.forEach(e => {
                    if (Math.hypot(e.x - dx, e.y - dy) < e.radius + 25) {
                        e.takeDamage(10 + lvl * 5, dx, dy);
                    }
                });
            }
        }

        collectGems() {
            const coinMult = 1 + (gameSave.upgrades.coin * 0.1);

            for (let i = gems.length - 1; i >= 0; i--) {
                const g = gems[i];
                const dist = Math.hypot(g.x - this.x, g.y - this.y);

                if (dist < this.pickupRadius) {
                    // Magnetic pull towards player
                    const angle = Math.atan2(this.y - g.y, this.x - g.x);
                    const speed = 8 + (1 - dist / this.pickupRadius) * 10;
                    g.x += Math.cos(angle) * speed;
                    g.y += Math.sin(angle) * speed;

                    if (dist < this.radius + 10) {
                        // Collected
                        if (g.type === 'coin') {
                            const val = Math.round(g.value * coinMult);
                            runCoins += val;
                            audio.playGem();
                            floatingTexts.push(new FloatingText(g.x, g.y, `+${val}💰`, '#facc15'));
                        } else {
                            this.gainExp(g.value);
                            audio.playGem();
                        }
                        gems.splice(i, 1);
                    }
                }
            }
        }

        gainExp(amount) {
            this.exp += amount;
            if (this.exp >= this.nextLevelExp) {
                this.exp -= this.nextLevelExp;
                this.level++;
                this.nextLevelExp = Math.round(this.nextLevelExp * 1.35 + 10);
                audio.playLevelUp();
                triggerLevelUpModal();
            }
            updateHUD();
        }

        takeDamage(dmg) {
            if (this.invincibleTimer > 0) return;
            this.hp -= dmg;
            this.invincibleTimer = 0.4; // 0.4 sec immunity

            floatingTexts.push(new FloatingText(this.x, this.y, `-${Math.round(dmg)}`, '#ef4444'));

            if (this.hp <= 0) {
                this.hp = 0;
                gameOver();
            }
            updateHUD();
        }

        draw(ctx) {
            ctx.save();
            ctx.translate(this.x, this.y);

            // Blink if invincible
            if (this.invincibleTimer > 0 && Math.floor(Date.now() / 50) % 2 === 0) {
                ctx.globalAlpha = 0.5;
            }

            // Draw Orbiting Drone if unlocked
            if (this.weapons['drone_cutter']) {
                const droneAngle = gameTime * 1.5;
                const dx = Math.cos(droneAngle) * 90;
                const dy = Math.sin(droneAngle) * 90;

                ctx.save();
                ctx.translate(dx, dy);
                ctx.fillStyle = '#818cf8';
                ctx.beginPath();
                ctx.arc(0, 0, 10, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#c7d2fe';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Spinning mini blades
                ctx.strokeStyle = '#6366f1';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(0, 0, 20, gameTime * 10, gameTime * 10 + Math.PI);
                ctx.stroke();
                ctx.restore();
            }

            // Draw Orbit Blades
            if (this.weapons['orbit_blade']) {
                const lvl = this.weapons['orbit_blade'].level;
                const count = 1 + lvl;
                const orbitSpeed = 2.5;
                const orbitRadius = (60 + lvl * 8) * this.statAreaMult;

                for (let i = 0; i < count; i++) {
                    const bAngle = (gameTime * orbitSpeed) + (i * (Math.PI * 2 / count));
                    const bx = Math.cos(bAngle) * orbitRadius;
                    const by = Math.sin(bAngle) * orbitRadius;

                    ctx.save();
                    ctx.translate(bx, by);
                    ctx.rotate(gameTime * 12);
                    ctx.fillStyle = '#34d399';
                    ctx.beginPath();
                    ctx.arc(0, 0, 12, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#a7f3d0';
                    ctx.lineWidth = 3;
                    ctx.stroke();

                    // Saw teeth
                    ctx.fillStyle = '#059669';
                    for (let t = 0; t < 4; t++) {
                        ctx.rotate(Math.PI / 2);
                        ctx.fillRect(8, -2, 6, 4);
                    }
                    ctx.restore();
                }
            }

            // Rotate Mower body
            ctx.rotate(this.angle);

            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath();
            ctx.ellipse(0, 5, 24, 18, 0, 0, Math.PI * 2);
            ctx.fill();

            // Vehicle Body
            ctx.fillStyle = this.config.bodyColor;
            ctx.beginPath();
            ctx.roundRect(-22, -16, 44, 32, 8);
            ctx.fill();

            // Machine Top Deck Accent
            ctx.fillStyle = this.config.color;
            ctx.beginPath();
            ctx.roundRect(-14, -10, 28, 20, 6);
            ctx.fill();

            // Wheels
            ctx.fillStyle = '#1e293b';
            // Front & Back Wheels
            ctx.fillRect(-18, -20, 10, 6);
            ctx.fillRect(8, -20, 10, 6);
            ctx.fillRect(-18, 14, 10, 6);
            ctx.fillRect(8, 14, 10, 6);

            // Front Mower Cutter Deck
            ctx.fillStyle = '#94a3b8';
            ctx.fillRect(16, -14, 12, 28);
            // Spinning cutter teeth inside deck
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(22, -10);
            ctx.lineTo(22, 10);
            ctx.stroke();

            ctx.restore();
        }
    }

    class ScytheProjectile {
        constructor(x, y, angle, level, areaMult) {
            this.x = x;
            this.y = y;
            this.angle = angle;
            this.speed = 7;
            this.radius = 16 * areaMult;
            this.damage = 25 + level * 10;
            this.distTraveled = 0;
            this.maxDist = 280;
            this.returning = false;
            this.rotation = 0;
            this.hitEnemies = new Set();
        }

        update(dt) {
            this.rotation += 0.3;

            if (!this.returning) {
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;
                this.distTraveled += this.speed;
                if (this.distTraveled >= this.maxDist) {
                    this.returning = true;
                }
            } else {
                // Fly back to player
                const returnAngle = Math.atan2(player.y - this.y, player.x - this.x);
                this.x += Math.cos(returnAngle) * (this.speed + 2);
                this.y += Math.sin(returnAngle) * (this.speed + 2);

                if (Math.hypot(player.x - this.x, player.y - this.y) < 25) {
                    return false; // Remove
                }
            }

            // Cut grass along path
            player.cutGrassInRadius(this.x, this.y, this.radius);

            // Hit Mobs
            enemies.forEach(e => {
                if (!this.hitEnemies.has(e.id) && Math.hypot(e.x - this.x, e.y - this.y) < e.radius + this.radius) {
                    e.takeDamage(this.damage, this.x, this.y);
                    this.hitEnemies.add(e.id);
                }
            });

            return true;
        }

        draw(ctx) {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.rotation);

            ctx.strokeStyle = '#a3e635';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(0, 0, this.radius, 0, Math.PI * 1.2);
            ctx.stroke();

            ctx.restore();
        }
    }

    class LaserBeam {
        constructor(x, y, target, level) {
            this.x = x;
            this.y = y;
            this.tx = target.x;
            this.ty = target.y;
            this.life = 0.2; // 0.2 seconds duration
            this.maxLife = 0.2;
            this.damage = 30 + level * 15;

            target.takeDamage(this.damage, target.x, target.y);
            player.cutGrassInRadius(target.x, target.y, 35);
        }

        update(dt) {
            this.life -= dt;
            return this.life > 0;
        }

        draw(ctx) {
            ctx.save();
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = (this.life / this.maxLife) * 8 + 2;
            ctx.shadowColor = '#0284c7';
            ctx.shadowBlur = 10;

            ctx.beginPath();
            ctx.moveTo(this.x, this.y);
            ctx.lineTo(this.tx, this.ty);
            ctx.stroke();

            ctx.restore();
        }
    }

    class PulseWave {
        constructor(x, y, maxRadius, level) {
            this.x = x;
            this.y = y;
            this.radius = 10;
            this.maxRadius = maxRadius;
            this.damage = 40 + level * 20;
            this.hitEnemies = new Set();
        }

        update(dt) {
            this.radius += 180 * dt;
            player.cutGrassInRadius(this.x, this.y, this.radius);

            enemies.forEach(e => {
                if (!this.hitEnemies.has(e.id) && Math.hypot(e.x - this.x, e.y - this.y) < e.radius + this.radius) {
                    e.takeDamage(this.damage, this.x, this.y);
                    this.hitEnemies.add(e.id);
                }
            });

            return this.radius < this.maxRadius;
        }

        draw(ctx) {
            ctx.save();
            ctx.strokeStyle = 'rgba(249, 115, 22, ' + (1 - this.radius / this.maxRadius) + ')';
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
        }
    }

    let mobIdCounter = 0;

    class Enemy {
        constructor(x, y, type) {
            this.id = ++mobIdCounter;
            this.x = x;
            this.y = y;
            this.type = type; // 'weed_normal', 'weed_fast', 'weed_boss'

            if (type === 'weed_boss') {
                this.radius = 35;
                this.hp = 800 + (gameTime * 15);
                this.maxHp = this.hp;
                this.speed = 1.6;
                this.damage = 25;
                this.color = '#ef4444';
                this.expValue = 100;
                this.isBoss = true;
            } else if (type === 'weed_fast') {
                this.radius = 14;
                this.hp = 25 + (gameTime * 0.8);
                this.maxHp = this.hp;
                this.speed = 3.2;
                this.damage = 8;
                this.color = '#f59e0b';
                this.expValue = 6;
                this.isBoss = false;
            } else {
                // Normal Weed
                this.radius = 18;
                this.hp = 40 + (gameTime * 1.2);
                this.maxHp = this.hp;
                this.speed = 2.1;
                this.damage = 12;
                this.color = '#a3e635';
                this.expValue = 3;
                this.isBoss = false;
            }

            this.angle = 0;
            this.hitFlash = 0;
        }

        update(dt) {
            if (this.hitFlash > 0) this.hitFlash -= dt;

            // Move towards player
            const angle = Math.atan2(player.y - this.y, player.x - this.x);
            this.angle = angle;

            this.x += Math.cos(angle) * this.speed;
            this.y += Math.sin(angle) * this.speed;

            // Damage player on contact
            const dist = Math.hypot(player.x - this.x, player.y - this.y);
            if (dist < player.radius + this.radius) {
                player.takeDamage(this.damage);
            }
        }

        takeDamage(dmg, hitX, hitY) {
            this.hp -= dmg;
            this.hitFlash = 0.15;

            // Knockback
            const kAngle = Math.atan2(this.y - hitY, this.x - hitX);
            this.x += Math.cos(kAngle) * 8;
            this.y += Math.sin(kAngle) * 8;

            floatingTexts.push(new FloatingText(this.x, this.y, Math.round(dmg), '#ffffff'));

            // Spurt leaf particles
            for (let i = 0; i < 3; i++) {
                particles.push(new Particle(
                    this.x, this.y,
                    (Math.random() - 0.5) * 4,
                    (Math.random() - 0.5) * 4,
                    this.color,
                    Math.random() * 4 + 2,
                    0.3
                ));
            }

            if (this.hp <= 0) {
                this.die();
            }
        }

        die() {
            killsCount++;
            
            // Drop gems/coins
            gems.push(new Gem(this.x, this.y, this.isBoss ? 'purple' : 'green', this.expValue));

            // Chance for Gold Coins
            if (Math.random() < 0.25 || this.isBoss) {
                const coinsCount = this.isBoss ? 10 : 1;
                for (let c = 0; c < coinsCount; c++) {
                    gems.push(new Gem(
                        this.x + (Math.random() - 0.5) * 20,
                        this.y + (Math.random() - 0.5) * 20,
                        'coin',
                        5
                    ));
                }
            }

            if (this.isBoss) {
                document.getElementById('boss-hp-container').classList.add('hidden');
            }
        }

        draw(ctx) {
            ctx.save();
            ctx.translate(this.x, this.y);

            if (this.hitFlash > 0) {
                ctx.fillStyle = '#ffffff';
            } else {
                ctx.fillStyle = this.color;
            }

            // Draw Mutant Weed monster body
            ctx.beginPath();
            ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
            ctx.fill();

            // Sharp leaves tentacles
            ctx.rotate(this.angle + Math.sin(gameTime * 8) * 0.2);
            ctx.fillStyle = '#15803d';
            for (let i = 0; i < 4; i++) {
                ctx.rotate(Math.PI / 2);
                ctx.beginPath();
                ctx.moveTo(this.radius, -4);
                ctx.lineTo(this.radius + 12, 0);
                ctx.lineTo(this.radius, 4);
                ctx.fill();
            }

            // Red Mutant Eyes
            ctx.fillStyle = '#ef4444';
            ctx.beginPath();
            ctx.arc(6, -5, 3, 0, Math.PI * 2);
            ctx.arc(6, 5, 3, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }
    }

    class Gem {
        constructor(x, y, type, value) {
            this.x = x;
            this.y = y;
            this.type = type; // 'green', 'purple', 'coin'
            this.value = value;
            this.radius = type === 'coin' ? 7 : (type === 'purple' ? 10 : 6);
        }

        draw(ctx) {
            ctx.save();
            ctx.translate(this.x, this.y);

            if (this.type === 'coin') {
                ctx.fillStyle = '#facc15';
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#ca8a04';
                ctx.lineWidth = 2;
                ctx.stroke();
            } else {
                ctx.fillStyle = this.type === 'purple' ? '#c084fc' : '#4ade80';
                ctx.beginPath();
                ctx.moveTo(0, -this.radius);
                ctx.lineTo(this.radius, 0);
                ctx.lineTo(0, this.radius);
                ctx.lineTo(-this.radius, 0);
                ctx.closePath();
                ctx.fill();
            }

            ctx.restore();
        }
    }

    class Particle {
        constructor(x, y, vx, vy, color, size, life) {
            this.x = x;
            this.y = y;
            this.vx = vx;
            this.vy = vy;
            this.color = color;
            this.size = size;
            this.maxLife = life;
            this.life = life;
        }

        update(dt) {
            this.x += this.vx;
            this.y += this.vy;
            this.life -= dt;
            return this.life > 0;
        }

        draw(ctx) {
            ctx.save();
            ctx.globalAlpha = Math.max(0, this.life / this.maxLife);
            ctx.fillStyle = this.color;
            ctx.fillRect(this.x, this.y, this.size, this.size);
            ctx.restore();
        }
    }

    class FloatingText {
        constructor(x, y, text, color) {
            this.x = x + (Math.random() - 0.5) * 10;
            this.y = y;
            this.text = text;
            this.color = color;
            this.life = 0.8;
            this.maxLife = 0.8;
        }

        update(dt) {
            this.y -= 25 * dt;
            this.life -= dt;
            return this.life > 0;
        }

        draw(ctx) {
            ctx.save();
            ctx.globalAlpha = Math.max(0, this.life / this.maxLife);
            ctx.fillStyle = this.color;
            ctx.font = 'bold 14px sans-serif';
            ctx.fillText(this.text, this.x, this.y);
            ctx.restore();
        }
    }

    // Helper: Find closest enemy to coordinate
    function getClosestEnemy(x, y, maxRange) {
        let closest = null;
        let minDist = maxRange;

        enemies.forEach(e => {
            const d = Math.hypot(e.x - x, e.y - y);
            if (d < minDist) {
                minDist = d;
                closest = e;
            }
        });

        return closest;
    }

    let spawnTimer = 0;
    let bossSpawnedAt = [];

    function updateSpawner(dt) {
        spawnTimer += dt;
        
        // Dynamic spawn rate scaling with game time
        const spawnInterval = Math.max(0.3, 1.8 - (gameTime / 120));

        if (spawnTimer >= spawnInterval) {
            spawnTimer = 0;
            
            // Spawn mob outside viewport
            const angle = Math.random() * Math.PI * 2;
            const dist = Math.max(canvas.width, canvas.height) / 2 + 100;
            const ex = player.x + Math.cos(angle) * dist;
            const ey = player.y + Math.sin(angle) * dist;

            const isFast = Math.random() < 0.35;
            enemies.push(new Enemy(ex, ey, isFast ? 'weed_fast' : 'weed_normal'));
        }

        // Boss Spawning (Every 90 Seconds)
        const bossMark = Math.floor(gameTime / 90);
        if (bossMark > 0 && !bossSpawnedAt.includes(bossMark)) {
            bossSpawnedAt.push(bossMark);
            const angle = Math.random() * Math.PI * 2;
            const ex = player.x + Math.cos(angle) * 400;
            const ey = player.y + Math.sin(angle) * 400;

            const boss = new Enemy(ex, ey, 'weed_boss');
            enemies.push(boss);

            document.getElementById('boss-hp-container').classList.remove('hidden');
        }

        // Update Boss HP bar if active boss exists
        const boss = enemies.find(e => e.isBoss);
        if (boss) {
            const bossHpBar = document.getElementById('boss-hp-bar');
            if (bossHpBar) {
                bossHpBar.style.width = `${Math.max(0, (boss.hp / boss.maxHp) * 100)}%`;
            }
        }
    }

    function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.save();
        // Camera smooth follow player
        camera.x = player.x - canvas.width / 2;
        camera.y = player.y - canvas.height / 2;
        ctx.translate(-camera.x, -camera.y);

        // 1. Draw Field Background Grid
        ctx.fillStyle = '#0f291e'; // Mowed dark green lawn background
        ctx.fillRect(0, 0, WORLD_SIZE, WORLD_SIZE);

        // Grid lines
        ctx.strokeStyle = '#143828';
        ctx.lineWidth = 1;
        for (let x = 0; x < WORLD_SIZE; x += 100) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, WORLD_SIZE);
            ctx.stroke();
        }
        for (let y = 0; y < WORLD_SIZE; y += 100) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(WORLD_SIZE, y);
            ctx.stroke();
        }

        // 2. Draw Grass Blades Grid
        const cols = Math.floor(WORLD_SIZE / GRASS_CELL_SIZE);
        const startC = Math.max(0, Math.floor(camera.x / GRASS_CELL_SIZE));
        const endC = Math.min(cols - 1, Math.ceil((camera.x + canvas.width) / GRASS_CELL_SIZE));
        const startR = Math.max(0, Math.floor(camera.y / GRASS_CELL_SIZE));
        const endR = Math.min(cols - 1, Math.ceil((camera.y + canvas.height) / GRASS_CELL_SIZE));

        for (let r = startR; r <= endR; r++) {
            for (let c = startC; c <= endC; c++) {
                const tile = grassTiles[r * cols + c];
                if (tile && tile.state === 1) {
                    ctx.fillStyle = '#16a34a';
                    // Draw tall grass tuft
                    ctx.fillRect(tile.x - 18, tile.y - 18, 36, 36);
                    ctx.fillStyle = '#22c55e';
                    ctx.fillRect(tile.x - 12, tile.y - 12, 24, 24);
                }
            }
        }

        // 3. Draw Gems
        gems.forEach(g => g.draw(ctx));

        // 4. Draw Enemies
        enemies.forEach(e => e.draw(ctx));

        // 5. Draw Player
        player.draw(ctx);

        // 6. Draw Projectiles
        projectiles.forEach(p => p.draw(ctx));

        // 7. Draw Particles
        particles.forEach(pt => pt.draw(ctx));

        // 8. Draw Floating Damage Numbers
        floatingTexts.forEach(ft => ft.draw(ctx));

        ctx.restore();
    }

    function gameLoop(time) {
        if (!gameRunning) return;

        const dt = Math.min(0.1, (time - lastTime) / 1000);
        lastTime = time;

        if (!gamePaused) {
            gameTime += dt;

            player.update(dt);
            updateSpawner(dt);

            // Update enemies
            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                e.update(dt);
                if (e.hp <= 0) {
                    enemies.splice(i, 1);
                }
            }

            // Update projectiles
            for (let i = projectiles.length - 1; i >= 0; i--) {
                if (!projectiles[i].update(dt)) {
                    projectiles.splice(i, 1);
                }
            }

            // Update particles
            for (let i = particles.length - 1; i >= 0; i--) {
                if (!particles[i].update(dt)) {
                    particles.splice(i, 1);
                }
            }

            // Update floating texts
            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                if (!floatingTexts[i].update(dt)) {
                    floatingTexts.splice(i, 1);
                }
            }

            updateHUD();
        }

        render();
        requestAnimationFrame(gameLoop);
    }

    function updateHUD() {
        document.getElementById('hud-level').innerText = `LV.${player.level}`;
        document.getElementById('hud-exp-bar').style.width = `${(player.exp / player.nextLevelExp) * 100}%`;
        document.getElementById('hud-exp-text').innerText = `${player.exp} / ${player.nextLevelExp}`;

        const mins = Math.floor(gameTime / 60).toString().padStart(2, '0');
        const secs = Math.floor(gameTime % 60).toString().padStart(2, '0');
        document.getElementById('hud-time').innerText = `${mins}:${secs}`;
        document.getElementById('hud-kills').innerText = `已割草: ${killsCount}`;
        document.getElementById('hud-coins').innerText = `${runCoins}`;

        document.getElementById('hud-hp-text').innerText = `${Math.ceil(player.hp)} / ${player.maxHp}`;
        document.getElementById('hud-hp-bar').style.width = `${Math.max(0, (player.hp / player.maxHp) * 100)}%`;
    }

    function triggerLevelUpModal() {
        gamePaused = true;

        // Shuffle & pick 3 skills from SKILL_POOL
        const shuffled = [...SKILL_POOL].sort(() => Math.random() - 0.5);
        const options = shuffled.slice(0, 3);

        const container = document.getElementById('upgrade-cards-container');
        container.innerHTML = '';

        options.forEach(skill => {
            const currentLvl = player.weapons[skill.id] ? player.weapons[skill.id].level : 0;
            const isNew = currentLvl === 0 && skill.type === 'weapon';

            const card = document.createElement('div');
            card.className = `glass-panel rounded-2xl p-4 border border-slate-700 flex flex-col justify-between items-center text-center card-hover cursor-pointer bg-slate-900/90`;
            card.innerHTML = `
                <div class="w-14 h-14 rounded-2xl bg-gradient-to-br ${skill.color} flex items-center justify-center text-2xl text-white shadow-lg mb-3">
                    <i class="fa-solid ${skill.icon}"></i>
                </div>
                <div class="text-xs font-bold text-emerald-400 mb-1">${isNew ? '【新武器技能】' : (currentLvl > 0 ? `等级 ${currentLvl} ➔ ${currentLvl + 1}` : '【属性强化】')}</div>
                <h3 class="font-bold text-white text-base mb-1">${skill.name}</h3>
                <p class="text-xs text-slate-300 mb-4 flex-1">${skill.desc}</p>
                <button class="w-full py-2 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs rounded-xl transition">
                    选择强化
                </button>
            `;

            card.onclick = () => {
                applySkill(skill);
                document.getElementById('modal-upgrade').classList.add('hidden');
                gamePaused = false;
            };

            container.appendChild(card);
        });

        document.getElementById('modal-upgrade').classList.remove('hidden');
    }

    function applySkill(skill) {
        if (skill.type === 'weapon') {
            player.addWeapon(skill.id);
        } else if (skill.id === 'stat_speed') {
            player.statSpeedMult += 0.10;
        } else if (skill.id === 'stat_area') {
            player.statAreaMult += 0.15;
        } else if (skill.id === 'stat_cd') {
            player.statCdMult *= 0.90;
        } else if (skill.id === 'stat_heal') {
            player.maxHp += 20;
            player.hp = Math.min(player.maxHp, player.hp + player.maxHp * 0.3);
        }
    }

    function startGame() {
        audio.init();

        const mowerConfig = MOWER_TYPES.find(m => m.id === selectedMowerId);
        
        // Reset states
        gameTime = 0;
        killsCount = 0;
        runCoins = 0;
        enemies = [];
        gems = [];
        particles = [];
        projectiles = [];
        floatingTexts = [];
        bossSpawnedAt = [];

        initGrassWorld();
        player = new Player(mowerConfig);

        document.getElementById('screen-menu').classList.add('hidden');
        document.getElementById('game-hud').classList.remove('hidden');
        document.getElementById('joystick-zone').classList.remove('hidden');

        gameRunning = true;
        gamePaused = false;
        lastTime = performance.now();

        requestAnimationFrame(gameLoop);
    }

    function gameOver() {
        gamePaused = true;
        gameSave.coins += runCoins;
        saveGame();

        const mins = Math.floor(gameTime / 60).toString().padStart(2, '0');
        const secs = Math.floor(gameTime % 60).toString().padStart(2, '0');

        document.getElementById('go-kills').innerText = killsCount;
        document.getElementById('go-coins').innerText = `+${runCoins}`;
        document.getElementById('go-time').innerText = `${mins}:${secs}`;
        document.getElementById('go-level').innerText = `LV.${player.level}`;

        document.getElementById('modal-gameover').classList.remove('hidden');
    }

    function renderGarage() {
        document.getElementById('garage-coins').innerText = gameSave.coins;
        const list = document.getElementById('garage-upgrades-list');
        list.innerHTML = '';

        GARAGE_UPGRADES.forEach(up => {
            const currentLvl = gameSave.upgrades[up.key] || 0;
            const isMax = currentLvl >= up.max;
            const cost = up.cost + currentLvl * up.costInc;

            const item = document.createElement('div');
            item.className = 'glass-panel p-3.5 rounded-2xl border border-slate-700/70 flex items-center justify-between gap-3';
            item.innerHTML = `
                <div class="flex-1">
                    <div class="flex items-center justify-between">
                        <span class="font-bold text-sm text-white">${up.name}</span>
                        <span class="text-xs text-emerald-400 font-bold">等级 ${currentLvl} / ${up.max}</span>
                    </div>
                    <p class="text-xs text-slate-400 mt-0.5">${up.desc}</p>
                </div>
                <button ${isMax ? 'disabled' : ''} class="px-4 py-2 bg-amber-500 hover:bg-amber-400 disabled:bg-slate-700 disabled:text-slate-500 text-slate-950 font-bold text-xs rounded-xl shadow transition flex items-center gap-1">
                    ${isMax ? '已满级' : `<i class="fa-solid fa-coins"></i> ${cost}`}
                </button>
            `;

            item.querySelector('button').onclick = () => {
                if (!isMax && gameSave.coins >= cost) {
                    gameSave.coins -= cost;
                    gameSave.upgrades[up.key] = currentLvl + 1;
                    saveGame();
                    renderGarage();
                }
            };

            list.appendChild(item);
        });
    }

    function renderMowerSelection() {
        const container = document.getElementById('mower-select-container');
        container.innerHTML = '';

        MOWER_TYPES.forEach(m => {
            const isSelected = m.id === selectedMowerId;
            const card = document.createElement('div');
            card.className = `glass-panel p-3 rounded-2xl border ${isSelected ? 'border-emerald-400 bg-emerald-950/40' : 'border-slate-800'} flex flex-col items-center cursor-pointer transition`;
            card.innerHTML = `
                <div class="w-10 h-10 rounded-xl bg-slate-800 flex items-center justify-center text-xl mb-2 text-emerald-400">
                    <i class="fa-solid ${m.icon}"></i>
                </div>
                <div class="font-bold text-xs text-white text-center">${m.name}</div>
            `;
            card.onclick = () => {
                selectedMowerId = m.id;
                renderMowerSelection();
            };
            container.appendChild(card);
        });
    }

    window.addEventListener('keydown', e => {
        keys[e.code] = true;
    });
    window.addEventListener('keyup', e => {
        keys[e.code] = false;
    });

    // Mobile Touch Joystick Handling
    const joyZone = document.getElementById('joystick-zone');
    const joyBase = document.getElementById('joystick-base');
    const joyStick = document.getElementById('joystick-stick');

    joyZone.addEventListener('touchstart', e => {
        audio.init();
        const touch = e.touches[0];
        touchJoystick.active = true;
        touchJoystick.startX = touch.clientX;
        touchJoystick.startY = touch.clientY;
        touchJoystick.currX = touch.clientX;
        touchJoystick.currY = touch.clientY;

        joyBase.style.left = `${touch.clientX}px`;
        joyBase.style.top = `${touch.clientY}px`;
        joyBase.classList.remove('hidden');
    });

    joyZone.addEventListener('touchmove', e => {
        if (!touchJoystick.active) return;
        const touch = e.touches[0];
        touchJoystick.currX = touch.clientX;
        touchJoystick.currY = touch.clientY;

        const dx = touchJoystick.currX - touchJoystick.startX;
        const dy = touchJoystick.currY - touchJoystick.startY;
        const dist = Math.hypot(dx, dy);
        const maxDist = 45;

        const angle = Math.atan2(dy, dx);
        const moveDist = Math.min(dist, maxDist);

        joyStick.style.transform = `translate(calc(-50% + ${Math.cos(angle) * moveDist}px), calc(-50% + ${Math.sin(angle) * moveDist}px))`;

        touchJoystick.dirX = Math.cos(angle);
        touchJoystick.dirY = Math.sin(angle);
    });

    const resetJoystick = () => {
        touchJoystick.active = false;
        touchJoystick.dirX = 0;
        touchJoystick.dirY = 0;
        joyBase.classList.add('hidden');
    };

    joyZone.addEventListener('touchend', resetJoystick);
    joyZone.addEventListener('touchcancel', resetJoystick);

    // UI Buttons
    document.getElementById('btn-start-game').onclick = startGame;

    document.getElementById('btn-open-garage').onclick = () => {
        renderGarage();
        document.getElementById('modal-garage').classList.remove('hidden');
    };

    document.getElementById('btn-close-garage').onclick = () => {
        document.getElementById('modal-garage').classList.add('hidden');
    };

    document.getElementById('btn-pause').onclick = () => {
        gamePaused = true;
        const mins = Math.floor(gameTime / 60).toString().padStart(2, '0');
        const secs = Math.floor(gameTime % 60).toString().padStart(2, '0');
        document.getElementById('pause-time').innerText = `${mins}:${secs}`;
        document.getElementById('pause-kills').innerText = killsCount;
        document.getElementById('pause-weapons').innerText = Object.keys(player.weapons).length;
        document.getElementById('modal-pause').classList.remove('hidden');
    };

    document.getElementById('btn-resume').onclick = () => {
        document.getElementById('modal-pause').classList.add('hidden');
        gamePaused = false;
    };

    document.getElementById('btn-quit').onclick = () => {
        gameRunning = false;
        document.getElementById('modal-pause').classList.add('hidden');
        document.getElementById('game-hud').classList.add('hidden');
        document.getElementById('joystick-zone').classList.add('hidden');
        document.getElementById('screen-menu').classList.remove('hidden');
    };

    document.getElementById('btn-restart').onclick = () => {
        document.getElementById('modal-gameover').classList.add('hidden');
        startGame();
    };

    // Initialize Menu UI
    renderMowerSelection();
    </script>
</body>
